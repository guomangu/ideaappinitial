version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    volumes:
      - ./backend:/app:z
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres_password@database:5432/universal_db}
      - NODE_ENV=${NODE_ENV:-development}
      - API_PORT=${API_PORT:-3000}
      - AUTH_SECRET=${AUTH_SECRET}
    command: npm run dev
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
      - POSTGRES_DB=${POSTGRES_DB:-universal_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:z
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-universal_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
